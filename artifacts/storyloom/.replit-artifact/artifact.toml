kind = "web"
previewPath = "/"
title = "Storyloom"
description = "A private, local-first cinematic video creator that turns personal photos, clips, and music into a polished story video with minimal effort."
version = "1.0.0"
id = "artifacts/storyloom"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24787

[services.development]
run = "pnpm --filter @workspace/storyloom run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/storyloom", "run", "build" ]
serve = "static"
publicDir = "artifacts/storyloom/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24787"
BASE_PATH = "/"
